<div class="page-container">
  <div class="callback-card">
    <h2 class="title">{{ 'authCallback.title' | translate }}</h2>

    <div *ngIf="errorMessage; else loading" class="error-message">
      <p>{{ errorMessage }}</p>
      <a routerLink="/login">{{ 'authCallback.backToLogin' | translate }}</a>
    </div>

    <ng-template #loading>
      <mat-spinner diameter="48"></mat-spinner>
      <p class="subtitle">{{ 'authCallback.subtitle' | translate }}</p>
    </ng-template>
  </div>
</div>
