<div class="payment-modal-container">
  <h2 class="modal-title">{{ 'paymentModal.title' | translate }}</h2>

  <div class="form-group">
    <label class="form-label">{{ 'paymentModal.fullNameLabel' | translate }}</label>
    <input type="text" class="custom-input" [placeholder]="'paymentModal.fullNamePlaceholder' | translate" [(ngModel)]="fullName" />
  </div>

  <div class="form-group">
    <label class="form-label">{{ 'paymentModal.addressLabel' | translate }}</label>
    <input type="text" class="custom-input" [placeholder]="'paymentModal.addressPlaceholder' | translate" [(ngModel)]="addressLine" />
  </div>

  <div class="form-group">
    <label class="form-label">{{ 'paymentModal.cardNumberLabel' | translate }}</label>
    <div id="card-number-element" class="custom-input stripe-element"></div>
  </div>

  <div class="form-row">
    <div class="form-group half-width">
      <label class="form-label">{{ 'paymentModal.expirationDateLabel' | translate }}</label>
      <div id="card-expiry-element" class="custom-input stripe-element"></div>
    </div>
    <div class="form-group half-width">
      <label class="form-label">{{ 'paymentModal.securityCodeLabel' | translate }}</label>
      <div id="card-cvc-element" class="custom-input stripe-element"></div>
    </div>
  </div>

  <div id="card-errors" role="alert" *ngIf="cardError">{{ cardError }}</div>

  <div class="modal-actions">
    <button class="btn-cancel" (click)="onCancel()">{{ 'paymentModal.cancel' | translate }}</button>
    <button class="btn-add" (click)="onAdd()" [disabled]="isProcessing">
      {{ isProcessing ? ('paymentModal.processing' | translate) : ('paymentModal.add' | translate) }}
    </button>
  </div>
</div>
