<section class="overview-container">
        <ng-container *ngIf="viewState$ | async as viewState">
          <ng-container [ngSwitch]="viewState.status">
            <section *ngSwitchCase="'loading'" class="overview-info-state">
              <p>{{ 'overview.loading' | translate }}</p>
            </section>

            <section *ngSwitchCase="'error'" class="overview-info-state">
              <p>{{ 'overview.error' | translate }}</p>
            </section>

            <ng-container *ngSwitchCase="'empty'">
              <ng-container *ngTemplateOutlet="emptyMeasurements"></ng-container>
            </ng-container>

            <ng-container *ngSwitchDefault>
              <ng-container *ngIf="viewState.measurements as measurements">
          <app-aqi-card
            [aqiValue]="measurements.aqi?.value ?? null"
            [aqiCategory]="measurements.aqi?.category ?? null"
            [updatedAt]="measurements.recordedAt"
            [deviceCount]="measurements.deviceCount"
          ></app-aqi-card>

          <section class="overview-grid">
            <section class="pollutants-panel">
              <div class="panel-header">
                <div>
                  <h3>{{ 'overview.pollutantsTitle' | translate }}</h3>
                  <p>{{ 'overview.updatesEveryMinute' | translate }}</p>
                </div>
              </div>

              <div class="pollutants-grid">
                <app-pollutant-card
                  [label]="'overview.metrics.pm25.label' | translate"
                  [value]="measurements.pm2_5"
                  [unit]="'overview.metrics.pm25.unit' | translate"
                  [deltaLabel]="measurements.pm2_5DeltaLabel"
                  tone="warning"
                ></app-pollutant-card>
                <app-pollutant-card
                  [label]="'overview.metrics.co2.label' | translate"
                  [value]="measurements.co2"
                  [unit]="'overview.metrics.co2.unit' | translate"
                  [deltaLabel]="measurements.co2DeltaLabel"
                  tone="success"
                ></app-pollutant-card>
                <app-pollutant-card
                  [label]="'overview.metrics.temperature.label' | translate"
                  [value]="measurements.temperature"
                  [unit]="'overview.metrics.temperature.unit' | translate"
                  [deltaLabel]="measurements.temperatureDeltaLabel"
                  tone="info"
                ></app-pollutant-card>
                <app-pollutant-card
                  [label]="'overview.metrics.humidity.label' | translate"
                  [value]="measurements.humidity"
                  [unit]="'overview.metrics.humidity.unit' | translate"
                  [deltaLabel]="measurements.humidityDeltaLabel"
                  tone="success"
                ></app-pollutant-card>
              </div>
            </section>

            <div class="side-panels">
              <app-alerts-card [alerts]="measurements.alerts"></app-alerts-card>
            </div>
          </section>

          <section class="overview-grid">
            <app-organizations-card
              class="organizations-panel"
              [organizations]="measurements.organizations"
            ></app-organizations-card>
            <div class="side-panels"></div>
          </section>
              </ng-container>
            </ng-container>
          </ng-container>
        </ng-container>

        <ng-template #emptyMeasurements>
          <app-aqi-card [aqiValue]="null" [aqiCategory]="null" [updatedAt]="null"></app-aqi-card>
          <section class="overview-grid">
            <section class="pollutants-panel">
              <div class="panel-header">
                <div>
                  <h3>{{ 'overview.pollutantsTitle' | translate }}</h3>
                  <p>{{ 'overview.updatesEveryMinute' | translate }}</p>
                </div>
              </div>

              <div class="pollutants-grid">
                <app-pollutant-card [label]="'overview.metrics.pm25.label' | translate" [value]="null" [unit]="'overview.metrics.pm25.unit' | translate" tone="warning"></app-pollutant-card>
                <app-pollutant-card [label]="'overview.metrics.co2.label' | translate" [value]="null" [unit]="'overview.metrics.co2.unit' | translate" tone="success"></app-pollutant-card>
                <app-pollutant-card [label]="'overview.metrics.temperature.label' | translate" [value]="null" [unit]="'overview.metrics.temperature.unit' | translate" tone="info"></app-pollutant-card>
                <app-pollutant-card [label]="'overview.metrics.humidity.label' | translate" [value]="null" [unit]="'overview.metrics.humidity.unit' | translate" tone="success"></app-pollutant-card>
              </div>
            </section>

            <div class="side-panels">
              <app-alerts-card [alerts]="[]"></app-alerts-card>
            </div>
          </section>

          <section class="overview-grid">
            <app-organizations-card class="organizations-panel" [organizations]="[]"></app-organizations-card>
            <div class="side-panels"></div>
          </section>
        </ng-template>
      </section>
