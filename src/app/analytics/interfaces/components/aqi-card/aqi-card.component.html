<section class="aqi-card">
  <div class="aqi-header">
    <div class="aqi-title-row">
      <h2>{{ 'aqiCard.title' | translate }}</h2>
      <span class="status-pill" [ngClass]="toneClass">{{ displayCategory }}</span>
    </div>
    <span class="aqi-score">{{ displayAqiValue }}</span>
  </div>
  <div class="aqi-progress">
    <div class="aqi-progress-bar" [ngClass]="toneClass" [style.width.%]="progressPercent"></div>
  </div>
  <div class="aqi-footer">
    <div class="aqi-meta">
      <p>{{ 'aqiCard.averageOf' | translate }} {{ deviceLabel }}</p>
      <span>{{ updatedLabel }}</span>
      </div>
  </div>
</section>
