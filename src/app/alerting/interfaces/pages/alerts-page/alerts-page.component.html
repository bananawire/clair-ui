<div class="alerts-container">
        <!-- Header -->
        <div class="page-header">
          <h1 class="page-title">{{ 'alerts.title' | translate }}</h1>
        </div>

        <!-- Daily Chart -->
        <app-alert-daily-chart [data]="dailySummary"></app-alert-daily-chart>

        <!-- Update info -->
        <div class="update-info">
          <mat-icon class="update-icon">sync</mat-icon>
          <span>{{ 'alerts.updatedPrefix' | translate }} {{ formattedUpdateTime }}</span>
        </div>

        <!-- Tabs -->
        <div class="tabs-row">
          <button class="tab-btn" [class.active]="activeTab === 'active'" (click)="setTab('active')">
            {{ 'alerts.tab.active' | translate }}
          </button>
          <button class="tab-btn" [class.active]="activeTab === 'history'" (click)="setTab('history')">
            {{ 'alerts.tab.history' | translate }}
          </button>
        </div>

        <!-- Table -->
        <app-alert-table [alerts]="currentAlerts" [loading]="loadingAlerts"></app-alert-table>

        <!-- Pagination -->
        <nav class="pagination-bar" *ngIf="showPagination" [attr.aria-label]="'alerts.pagination.navAria' | translate">
          <button type="button" class="page-btn prev" (click)="prevPage()" [disabled]="currentPage === 0"
            [attr.aria-label]="'alerts.pagination.previous' | translate">
            <mat-icon class="page-btn-icon" aria-hidden="true">chevron_left</mat-icon>
            <span class="page-btn-label">{{ 'alerts.pagination.previous' | translate }}</span>
          </button>
          <span class="page-info" aria-live="polite">{{ 'alerts.pagination.pageInfo' | translate: { currentPage: currentPage + 1, totalPages: totalPages } }}</span>
          <button type="button" class="page-btn next" (click)="nextPage()" [disabled]="currentPage >= totalPages - 1"
            [attr.aria-label]="'alerts.pagination.next' | translate">
            <span class="page-btn-label">{{ 'alerts.pagination.next' | translate }}</span>
            <mat-icon class="page-btn-icon" aria-hidden="true">chevron_right</mat-icon>
          </button>
        </nav>
      </div>
