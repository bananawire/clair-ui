<h2 mat-dialog-title>{{ 'addSpaceDialog.title' | translate }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'addSpaceDialog.nameLabel' | translate }}</mat-label>
      <input matInput formControlName="name" [placeholder]="'addSpaceDialog.namePlaceholder' | translate" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">{{ 'addSpaceDialog.nameRequired' | translate }}</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ 'addSpaceDialog.cancel' | translate }}</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="submit()">{{ 'addSpaceDialog.create' | translate }}</button>
</mat-dialog-actions>
