<h2 mat-dialog-title>{{ 'deleteDeviceDialog.title' | translate }}</h2>
<mat-dialog-content>
  <p>{{ 'deleteDeviceDialog.messageStart' | translate }} <strong>{{ data.deviceName }}</strong>{{ 'deleteDeviceDialog.messageEnd' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ 'deleteDeviceDialog.cancel' | translate }}</button>
  <button mat-flat-button color="warn" (click)="confirm()">{{ 'deleteDeviceDialog.delete' | translate }}</button>
</mat-dialog-actions>
