<h2 mat-dialog-title>{{ 'claimDeviceDialog.title' | translate }}</h2>
<mat-dialog-content>
  <p class="description">{{ 'claimDeviceDialog.description' | translate }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ 'claimDeviceDialog.tokenLabel' | translate }}</mat-label>
        <input matInput formControlName="claimToken" [placeholder]="'claimDeviceDialog.tokenPlaceholder' | translate" autocomplete="off" />
        <mat-error *ngIf="form.get('claimToken')?.hasError('required')">{{ 'claimDeviceDialog.tokenRequired' | translate }}</mat-error>
        <mat-error *ngIf="form.get('claimToken')?.hasError('pattern')">{{ 'claimDeviceDialog.tokenPattern' | translate }}</mat-error>
      </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ 'claimDeviceDialog.cancel' | translate }}</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="submit()">{{ 'claimDeviceDialog.claim' | translate }}</button>
</mat-dialog-actions>
