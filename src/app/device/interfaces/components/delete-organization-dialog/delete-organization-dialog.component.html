<h2 mat-dialog-title>{{ 'deleteOrganizationDialog.title' | translate }}</h2>
<mat-dialog-content>
  <p>{{ 'deleteOrganizationDialog.message' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ 'deleteOrganizationDialog.cancel' | translate }}</button>
  <button mat-flat-button color="warn" (click)="confirm()">{{ 'deleteOrganizationDialog.delete' | translate }}</button>
</mat-dialog-actions>
