<h2 mat-dialog-title>{{ 'pairDeviceDialog.title' | translate }}</h2>
<mat-dialog-content>
  <p class="description">{{ 'pairDeviceDialog.description' | translate }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'pairDeviceDialog.hardwareIdLabel' | translate }}</mat-label>
      <input matInput formControlName="hardwareId" [placeholder]="'pairDeviceDialog.hardwareIdPlaceholder' | translate" autocomplete="off" />
      <mat-error *ngIf="form.get('hardwareId')?.hasError('required')">{{ 'pairDeviceDialog.hardwareIdRequired' | translate }}</mat-error>
      <mat-error *ngIf="form.get('hardwareId')?.hasError('pattern')">{{ 'pairDeviceDialog.hardwareIdPattern' | translate }}</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ 'pairDeviceDialog.cancel' | translate }}</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="submit()">{{ 'pairDeviceDialog.pair' | translate }}</button>
</mat-dialog-actions>
