<h2 mat-dialog-title>{{ data.title | translate }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ data.fieldLabel | translate }}</mat-label>
      <input matInput formControlName="value" [placeholder]="data.placeholder | translate" />
      <mat-error *ngIf="form.get('value')?.hasError('required')">{{ 'editNameDialog.valueRequired' | translate }}</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ 'editNameDialog.cancel' | translate }}</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="submit()">{{ 'editNameDialog.save' | translate }}</button>
</mat-dialog-actions>
