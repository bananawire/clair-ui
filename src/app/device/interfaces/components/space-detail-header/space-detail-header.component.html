<div *ngIf="space" class="detail-header">
  <div class="detail-title">
    <h1>{{ space.name }}</h1>
    <p class="subtitle">{{ 'spaceDetailHeader.subtitle' | translate }}</p>
  </div>
  <div class="detail-actions">
    <button mat-fab class="action-button action-button--primary" type="button" (click)="requestClaimDevice()" [attr.aria-label]="'spaceDetailHeader.claimSensorAria' | translate">
      <mat-icon>add</mat-icon>
    </button>
    <button mat-fab class="action-button action-button--secondary" type="button" (click)="requestPairDevice()" [attr.aria-label]="'spaceDetailHeader.pairSensorHardwareAria' | translate">
      <mat-icon>sensors</mat-icon>
    </button>
    <button mat-fab class="action-button action-button--secondary" type="button" [matMenuTriggerFor]="spaceMenu" [attr.aria-label]="'spaceDetailHeader.moreOptionsAria' | translate">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #spaceMenu="matMenu">
      <button mat-menu-item (click)="requestEditSpace()">
        <mat-icon>edit</mat-icon>
        <span>{{ 'spaceDetailHeader.editSpace' | translate }}</span>
      </button>
      <button mat-menu-item (click)="requestDeleteSpace()">
        <mat-icon>delete</mat-icon>
        <span>{{ 'spaceDetailHeader.deleteSpace' | translate }}</span>
      </button>
    </mat-menu>
  </div>
</div>
