<div class="layout">
  <app-header
    [isSidebarOpen]="isSidebarOpen"
    [isAssistantOpen]="isAssistantOpen"
    (sidebarToggleRequested)="toggleSidebar()"
    (assistantToggleRequested)="toggleAssistant()"
  ></app-header>

  <div class="body-layout">
    <app-sidebar [isOpen]="isSidebarOpen"></app-sidebar>

    <section class="content">
      <router-outlet></router-outlet>
    </section>
  </div>

  <app-assistant-panel
    *ngIf="assistantMounted"
    [open]="isAssistantOpen"
    (closeRequested)="closeAssistant()"
  ></app-assistant-panel>
</div>
