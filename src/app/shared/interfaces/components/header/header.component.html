<header class="header-container">
  <div class="header-left">
    <button mat-icon-button class="menu-button" (click)="onToggleSidebar()" [attr.aria-label]="'header.toggleSidebarAria' | translate">
      <mat-icon>{{ isSidebarOpen ? 'menu_open' : 'menu' }}</mat-icon>
    </button>
    <app-clair-lyrics class="logo"></app-clair-lyrics>
  </div>

  <div class="header-right">
    <button
      mat-icon-button
      class="action-button assistant-button"
      [class.active]="isAssistantOpen"
      [attr.aria-label]="'header.assistantAria' | translate"
      [attr.aria-expanded]="isAssistantOpen"
      [attr.title]="'header.assistantAria' | translate"
      (click)="onToggleAssistant($event)"
    >
      <app-ai-assistant class="assistant-icon"></app-ai-assistant>
    </button>
  </div>
</header>
